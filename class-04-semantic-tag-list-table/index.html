<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline vs Block Elements</title>

<body>
    <h1>
        This is the block level element
        <span>This is the inline level element</span>
    </h1>
    <span>
        This is inline level element

    </span>
</body>
</html>
