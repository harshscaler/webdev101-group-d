<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        div {
            margin: 10px;
            border: 20px solid black;
            padding: 30px;
            width: 200px;
            height: 400px;
        }

        .content-box {
            box-sizing: content-box;
            background-color: lightblue;
        }

        .border-box {
            box-sizing: border-box;
            background-color: lightgreen;
        }

        span {
            background-color: lightcoral;
            color: white;
            padding : 10px;
            
            display: block;

            /* margin-top: 10px;
            margin-right : 20px;
            margin-bottom : 30px;
            margin-left : 40px; */
            margin : 10px ;
        }
    </style>
</head>
<body>
    <div class="content-box">
        <h2>Content Box</h2>
        <p>This is a paragraph inside a div.</p>
        <!-- <p>width : 100px</p>
        <p>height : 100px</p> -->
        <p>margin : 10px</p>
        <p>border : 20px</p>
        <p>padding : 30px</p>

    </div>

    <div class="border-box">
        <h2>Border Box</h2>
        <p>This is a paragraph inside a div.</p>
        <p>margin : 10px</p>
        <p>border : 20px</p>
        <p>padding : 30px</p>
    </div>
    
    <p>Lorem ipsum dolor sit, amet <span>consectetur</span> adipisicing elit. Iure, optio.</p>
</body>
</html>
